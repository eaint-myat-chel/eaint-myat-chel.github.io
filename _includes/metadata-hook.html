<script>
  if (window.Theme?.isToggleable && Theme.isSystemTheme) {
    Theme.update(Theme.Mode.DARK);
  }
</script>

<style>
  {% if site.avatar == nil or site.avatar == empty %}
    #sidebar #avatar {
      display: none;
    }
  {% endif %}

  {% if page.layout == 'home' %}
    @media (min-width: 992px) {
      #topbar-wrapper {
        height: 4rem;
      }
    }
  {% else %}
    /* Chirpy's shared scripts still expect the search elements in the DOM. */
    #search-trigger {
      visibility: hidden;
    }

    #search,
    #search-cancel {
      display: none !important;
    }
  {% endif %}
</style>
